services:
  mysql:
    image: mysql:8.4
    container_name: rag-item-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_item}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: rag-item-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-1234}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1234}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-item-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:latest
    container_name: rag-item-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: rag-item-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  bootstrap:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rag-item-bootstrap
    volumes:
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_item}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      REDIS_DB: ${REDIS_DB:-1}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_DATABASE_NAME: ${MILVUS_DATABASE_NAME:-default}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-c1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v3.2}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LOG_FILE: /app/integrated_qa_system/logs/edu-rag.log
      BOOTSTRAP_FAQ: ${BOOTSTRAP_FAQ:-true}
      BOOTSTRAP_VECTOR_DATA: ${BOOTSTRAP_VECTOR_DATA:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    command: ["python", "docker/bootstrap_app_data.py"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rag-item-backend
    volumes:
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_item}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      REDIS_DB: ${REDIS_DB:-1}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_DATABASE_NAME: ${MILVUS_DATABASE_NAME:-default}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-c1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v3.2}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
      LOG_FILE: /app/integrated_qa_system/logs/edu-rag.log
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
